services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: hcm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hcm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-homelab_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Aplicación unificada HCM (Backend API + Frontend Estático + Simulador Integrado)
  hcm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcm-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-homelab_monitor}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-true}
      METRICS_INTERVAL: ${METRICS_INTERVAL:-5000}
      FRONTEND_PATH: /app/frontend
    ports:
      - "${PORT:-3000}:3000"
      - "8080:3000" # Compatibilidad: acceso directo tanto por puerto 3000 como por 8080
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hcm-network
    restart: unless-stopped

networks:
  hcm-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
